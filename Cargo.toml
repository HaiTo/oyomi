[package]
name = "oyomi"
version = "0.1.0"
edition = "2021"
description = "Deterministic, diff-friendly text rendering of OOXML documents (xlsx/docx/pptx) for git textconv"
license = "MIT"
repository = "https://github.com/HaiTo/oyomi"
readme = "README.md"
keywords = ["ooxml", "xlsx", "docx", "diff", "textconv"]
categories = ["command-line-utilities", "text-processing", "development-tools"]

[dependencies]
calamine = { version = "0.36", features = ["dates"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
